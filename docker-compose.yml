services:
  postgres:
    image: postgres:16-alpine
    container_name: tracker-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kivo_networks

  app:
    build:
      context: ..
      dockerfile: ./Dockerfile
    container_name: tracker-backend
    env_file:
      - .env
    volumes:
      - attachments:/var/data/nexa-tracker
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kivo_networks

volumes:
  postgres-data:
  attachments:

networks:
  kivo_networks: